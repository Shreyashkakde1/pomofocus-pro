name: Build & Deploy Pomofocus Pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Build & Test Job
  # ============================================================================
  build:
    name: Build Frontend & Backend
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Build Frontend SPA
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

      # Build Backend JAR
      - name: Build Backend JAR
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B --no-transfer-progress

      # Save artifacts for deployment
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

      # Save artifacts for deployment
      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ============================================================================
  # 2. Automated VPS Deploy Job
  # ============================================================================
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # Configure SSH client
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $VPS_PORT $VPS_HOST >> ~/.ssh/known_hosts

          echo "🚀 Deploying to VPS ($VPS_HOST)..."

          # 1. Sync frontend production build to /var/www/pomofocus/dist
          ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "mkdir -p /var/www/pomofocus/dist"
          scp -P $VPS_PORT -r dist/* $VPS_USER@$VPS_HOST:/var/www/pomofocus/dist/

          # 2. Pull latest git changes and restart backend Docker container
          ssh -p $VPS_PORT $VPS_USER@$VPS_HOST '
            set -e
            cd /var/www/pomofocus-pro || cd ~/projects/pomofocus-pro || exit 1
            git pull origin main
            if [ -f .env.production ] && [ ! -f .env ]; then
              cp .env.production .env
            fi
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose -f docker-compose.prod.yml up -d --build pomofocus-backend
            else
              docker compose -f docker-compose.prod.yml up -d --build pomofocus-backend
            fi
            echo "✅ Pomofocus Pro deployment completed successfully!"
          '
