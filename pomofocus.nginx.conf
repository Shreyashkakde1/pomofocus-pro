# ==============================================================================
# Pomofocus Pro - Nginx Virtual Host Configuration
# Place at: /etc/nginx/sites-available/pomofocus
# Enable with: sudo ln -s /etc/nginx/sites-available/pomofocus /etc/nginx/sites-enabled/
# SSL with: sudo certbot --nginx -d pomofocus.shreyashkakde.in
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pomofocus.shreyashkakde.in;

    # Maximum upload/request body size
    client_max_body_size 10M;

    # Gzip Compression for high-performance asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 1. Frontend Static Assets (Vite Production Build)
    location / {
        root /var/www/pomofocus/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable Vite bundles with long expiration
    location /assets/ {
        root /var/www/pomofocus/dist;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # 2. Backend REST API Proxy (Spring Boot on 127.0.0.1:8085)
    location /api/ {
        proxy_pass http://127.0.0.1:8085/api/;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Keep-Alive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

