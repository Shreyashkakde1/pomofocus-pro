# Spring Boot Configuration
spring.application.name=pomofocus-pro
server.port=${SERVER_PORT:8085}

# PostgreSQL 16 Datasource (Port 5435)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:pomopro}
spring.datasource.username=${DB_USER:pomouser}
spring.datasource.password=${DB_PASS:pomopass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Mail Service (Resend SMTP via SSL)
spring.mail.host=${SPRING_MAIL_HOST:smtp.resend.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:resend}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Specific Mail Properties
app.mail.from-address=${MAIL_FROM_ADDRESS:onboarding@resend.dev}
app.mail.from-name=${MAIL_FROM_NAME:Pomofocus Pro}

# Security & JWT Token
app.jwt.secret=${JWT_SECRET:404e635266556a586e3272357538782f413f4428472b4b6250645367566b5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Jackson JSON
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC
