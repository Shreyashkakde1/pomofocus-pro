# ==============================================================================
# Pomofocus Pro - Production Docker Compose (VPS Deployment)
# Isolated services bound strictly to 127.0.0.1 for zero public port exposure
# ==============================================================================

services:
  pomofocus-postgres:
    image: postgres:16-alpine
    container_name: pomofocus-postgres-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: pomofocus
      POSTGRES_USER: ${DB_USER:-pomofocus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.production}
    volumes:
      - pomofocus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pomofocus} -d pomofocus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pomofocus-network
    deploy:
      resources:
        limits:
          memory: 256M

  pomofocus-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pomofocus-backend-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://pomofocus-postgres:5432/pomofocus
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-pomofocus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://pomofocus.shreyashkakde.in,http://pomofocus.shreyashkakde.in}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://pomofocus.shreyashkakde.in,http://pomofocus.shreyashkakde.in}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.resend.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-resend}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    depends_on:
      pomofocus-postgres:
        condition: service_healthy
    networks:
      - pomofocus-network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  pomofocus-network:
    driver: bridge

volumes:
  pomofocus_pgdata:
    name: pomofocus_pgdata

